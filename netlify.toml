[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Serverless function timeout (Netlify Pro: up to 26s, Free: 10s)
[functions]
  node_bundler = "esbuild"

# Ensure dynamic routes are not statically cached
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"

# CORS headers for widget
[[headers]]
  for = "/widget.js"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

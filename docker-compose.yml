services:
  postgres:
    image: postgres:15-alpine
    container_name: weblingo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: weblingo
    ports:
      - "5432:5432"
    volumes:
      - weblingo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: weblingo-libretranslate
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: "en,es,fr,de,ar,ur"
    volumes:
      - weblingo_ltmodels:/home/libretranslate/.local/share
    profiles: ["translate"]

volumes:
  weblingo_pgdata:
  weblingo_ltmodels:
